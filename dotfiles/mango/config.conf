# MangoWC Configuration - Nord Theme

# Environment variables
env = XDG_CURRENT_DESKTOP,mango
env = XDG_SESSION_TYPE,wayland
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = NO_AT_BRIDGE,1

# Tag rules (Workspaces 1-9)
tagrule = id:1, layout_name:tile
tagrule = id:2, layout_name:tile
tagrule = id:3, layout_name:tile
tagrule = id:4, layout_name:tile
tagrule = id:5, layout_name:tile
tagrule = id:6, layout_name:tile
tagrule = id:7, layout_name:tile
tagrule = id:8, layout_name:tile
tagrule = id:9, layout_name:tile

# Layout settings
new_is_master = 1
default_mfact = 0.5
default_nmaster = 1
smartgaps = 0
circle_layout = tile,scroller

# Scroller layout
scroller_structs = 40
scroller_default_proportion = 0.5
scroller_focus_center = 0
scroller_prefer_center = 0
scroller_prefer_overspread = 1
edge_scroller_pointer_focus = 1
scroller_default_proportion_single = 2.0
scroller_proportion_preset = 0.5, 0.8, 1.0

# Visuals: Gaps, Borders, Colors (Nord Theme)
gappih = 8
gappiv = 8
gappoh = 8
gappov = 8
borderpx = 1
border_radius = 6

# Nord Palette Colors (ARGB)
rootcolor = 0x2e3440ff
bordercolor = 0x4c566aff
focuscolor = 0x88c0d0ff
maximizescreencolor = 0x88c0d0ff
urgentcolor = 0xbf616aff
scratchpadcolor = 0x4c566acc
globalcolor = 0xb48eadaa
overlaycolor = 0x88c0d0ff

# Cursor
cursor_theme = Adwaita
cursor_size = 24

# Shadows & Animations
animations = 1
layer_animations = 1
animation_type_open = slide
animation_type_close = zoom
animation_fade_in = 1
animation_fade_out = 1
zoom_initial_ratio = 0.88
zoom_end_ratio = 1.0
animation_duration_move = 320
animation_duration_open = 280
animation_duration_tag = 420
animation_duration_close = 240
animation_curve_open = 0.16, 1.0, 0.3, 1.0
animation_curve_move = 0.22, 1.0, 0.36, 1.0
animation_curve_tag = 0.16, 1.0, 0.3, 1.0
animation_curve_close = 0.7, 0.0, 0.84, 0.0


blur = 0
blur_layer = 0
blur_optimized = 0
blur_params_num_passes = 0
blur_params_radius = 0
shadows = 1
layer_shadows = 1

# -----------
# Keybindings
# -----------

# Core Applications & Menus
bind = SUPER, Return, spawn, footclient
bind = SUPER, e, spawn, thunar
bind = SUPER, w, spawn, firefox
bind = SUPER, d, spawn, rofi-launcher
bind = SUPER, Space, spawn, rofi-launcher
bind = SUPER, q, killclient,
bind = SUPER, Escape, spawn, rofi-powermenu
bind = SUPER, t, spawn, theme-select
bind = SUPER+SHIFT, t, spawn, sh -c 'grim -g "$(slurp)" - | tesseract-ocr stdin stdout | wl-copy'
bind = SUPER+CTRL, t, spawn, theme-from-wallpaper
bind = SUPER+SHIFT, w, spawn, wallpaper-select
bind = SUPER, s, spawn, rofi-screenshot
bind = SUPER, v, spawn, clipboard-menu
bind = SUPER, r, reload_config

# Window State Toggles
bind = SUPER+SHIFT, f, togglefullscreen,
bind = SUPER, f, togglemaximizescreen,
bind = SUPER, c, togglefloating,
bind = SUPER, o, toggleoverlay,
bind = SUPER, Tab, toggleoverview,
bind = SUPER, l, spawn, swaylock -c 000000,

bind = SUPER+CTRL, Up, resizewin, +0, -40
bind = SUPER+CTRL, Down, resizewin, +0, +40
bind = SUPER+CTRL, Left, resizewin, -40, +0
bind = SUPER+CTRL, Right, resizewin, +40, +0

# Focus Directional Navigation
bind = SUPER, Left, focusdir, left
bind = SUPER, Right, focusdir, right
bind = SUPER, Up, focusdir, up
bind = SUPER, Down, focusdir, down
bind = SUPER, h, focusdir, left
bind = SUPER, l, focusdir, right
bind = SUPER, k, focusdir, up
bind = SUPER, j, focusdir, down

# Window Movement / Tiling Exchange
bind = SUPER+SHIFT, Left, exchange_client, left
bind = SUPER+SHIFT, Right, exchange_client, right
bind = SUPER+SHIFT, Up, exchange_client, up
bind = SUPER+SHIFT, Down, exchange_client, down
bind = SUPER+SHIFT, h, exchange_client, left
bind = SUPER+SHIFT, l, exchange_client, right
bind = SUPER+SHIFT, k, exchange_client, up
bind = SUPER+SHIFT, j, exchange_client, down

# Floating Window Controls
bind = CTRL+SHIFT, Up, movewin, +0, -40
bind = CTRL+SHIFT, Down, movewin, +0, +40
bind = CTRL+SHIFT, Left, movewin, -40, +0
bind = CTRL+SHIFT, Right, movewin, +40, +0
bind = CTRL+ALT, Up, resizewin, +0, -40
bind = CTRL+ALT, Down, resizewin, +0, +40
bind = CTRL+ALT, Left, resizewin, -40, +0
bind = CTRL+ALT, Right, resizewin, +40, +0

# Layout Switching
bind = SUPER+CTRL, l, switch_layout

# Tag (Workspace) Switching (1-9)
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0

# Move Window to Tag (1-9)
bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0

# Hardware Media Keys
bind = NONE, XF86AudioRaiseVolume, spawn, volume --inc
bind = NONE, XF86AudioLowerVolume, spawn, volume --dec
bind = NONE, XF86AudioMute, spawn, volume --toggle
bind = NONE, XF86AudioMicMute, spawn, volume --toggle-mic
bind = NONE, XF86MonBrightnessUp, spawn, brightness --inc
bind = NONE, XF86MonBrightnessDown, spawn, brightness --dec
bind = SUPER, Print, spawn, rofi-screenshot
bind = NONE, Print, spawn, sh -c 'grim -g "$(slurp)" - | satty --filename -'
bind = ALT, Print, spawn, sh -c 'grim -T "$(mmsg get focusing-client | jq -r ".foreign_toplevel_id")" - | wl-copy'

# Mouse bindings
mousebind = SUPER, btn_left, moveresize, curmove
mousebind = SUPER, btn_right, moveresize, curresize


# ------------
# Window Rules
# ------------
windowrule = isfloating:1, appid:^(pavucontrol|imv|mpv|nm-connection-editor|blueman-manager|btop|linktui|wiremix)$
windowrule = isfloating:1, appid:^(thunar)$
windowrule = isfloating:1, title:^(Open File|Select a File|Save As|Confirm|Preferences)$
windowrule = isfloating:1, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# ------------------
# Autostart Sequence
# ------------------
exec-once = mangobar
exec-once = pipewire-launcher.sh
exec-once = mako
exec-once = wallpaper-manager restore
exec-once = wl-paste --watch cliphist store
exec-once = foot --server
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1 || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || lxpolkit
