# ==============================================================================
# Ly Display Manager Configuration - Minimal Theme
# Void Linux × MangoWC Minimal Rice (Compatible with fairyglade/ly)
# Target: /etc/ly/config.ini
# ==============================================================================

# ------------------------------------------------------------------------------
# Appearance & Behavior
# ------------------------------------------------------------------------------
# Disable animations for instant, minimal, clean TUI appearance
animate = false
animation = 0

# The character used to mask the password
asterisk = *

# Background color id (0 = black/dark slate)
bg = 0

# Foreground color id (7 = clean off-white Snow Storm)
fg = 7

# Blank main box background (true = opaque box with defined bg color)
blank_box = true

# Erase password input on authentication failure
blank_password = true

# Box border visibility
hide_borders = false

# Margins and input dimensions
margin_box_h = 2
margin_box_v = 1
input_len = 34

# Active language
lang = en

# ------------------------------------------------------------------------------
# Session Management & Defaults
# ------------------------------------------------------------------------------
# Remember and reload the last selected desktop session and username
save = true
load = true
save_file = /etc/ly/save

# Focus password field on startup when username is saved (1=login, 2=password, 0=desktop)
default_input = 2

# Directory containing Wayland session desktop entries
waylandsessions = /usr/share/wayland-sessions
wayland_cmd = /etc/ly/wsetup.sh

# Service name (PAM authentication)
service_name = login

# ------------------------------------------------------------------------------
# System & Power Commands (Void Linux / runit)
# ------------------------------------------------------------------------------
shutdown_cmd = /sbin/shutdown -h now
restart_cmd = /sbin/shutdown -r now

# Virtual terminal number (Ly runs on TTY2 by default)
tty = 2
