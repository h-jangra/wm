<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Search path for bundled icon & monospace fonts -->
  <dir>~/.local/share/fonts/wm</dir>

  <!-- Default Monospace Configuration -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono</string>
      <string>SymbolsNF</string>
    </edit>
  </match>

  <!-- Fallback from Maple Mono to SymbolsNF for complete Nerd Font icon coverage -->
  <alias>
    <family>Maple Mono</family>
    <prefer>
      <family>Maple Mono</family>
      <family>SymbolsNF</family>
      <family>Material Symbols Rounded</family>
      <family>feather</family>
    </prefer>
  </alias>

  <!-- Compatibility Alias: JetBrainsMono Nerd Font -> Maple Mono + SymbolsNF -->
  <alias>
    <family>JetBrainsMono Nerd Font</family>
    <prefer>
      <family>Maple Mono</family>
      <family>SymbolsNF</family>
    </prefer>
  </alias>

  <!-- Compatibility Alias: Maple Mono NF -> Maple Mono + SymbolsNF -->
  <alias>
    <family>Maple Mono NF</family>
    <prefer>
      <family>Maple Mono</family>
      <family>SymbolsNF</family>
    </prefer>
  </alias>
</fontconfig>
