# ==============================================================================
# Ly Display Manager Configuration - Nord Theme
# Void Linux × MangoWC Minimal Rice
# Target: /etc/ly/config.ini
# ==============================================================================

# ------------------------------------------------------------------------------
# Appearance & Behavior
# ------------------------------------------------------------------------------
# Disable animations for instant, minimal, clean TUI appearance
animate = false
animation = none

# The character used to mask the password
asterisk = *

# Erase password input on authentication failure
clear_password = true
blank_password = true

# Blank main box background (true = opaque box with defined bg color)
blank_box = true

# Box border visibility
hide_borders = false

# Main box header title
box_title = MangoWC (Nord)

# Margins and input dimensions
margin_box_h = 2
margin_box_v = 1
input_len = 34

# ------------------------------------------------------------------------------
# Colors (Nord Palette)
# Format: 0xSSRRGGBB (SS = styling flag, RRGGBB = hex color)
# Styling: 0x00=regular, 0x01=bold, 0x02=underline
# ------------------------------------------------------------------------------
# Background: Polar Night Nord0 (#2E3440)
bg = 0x002E3440

# Foreground: Snow Storm Nord4 (#D8DEE9)
fg = 0x00D8DEE9

# Border: Frost Cyan Nord8 (#88C0D0)
border_fg = 0x0088C0D0

# Error Background & Foreground: Nord0 (#2E3440) & Bold Aurora Red Nord11 (#BF616A)
error_bg = 0x002E3440
error_fg = 0x01BF616A

# ------------------------------------------------------------------------------
# Clock & Status
# ------------------------------------------------------------------------------
# Clock format in top right corner (e.g., Mon Sep 14  15:30)
clock = %a %b %d  %H:%M
bigclock = none

# UI Hints
hide_key_hints = false
hide_keyboard_locks = false
hide_version_string = true

# ------------------------------------------------------------------------------
# Session Management & Defaults
# ------------------------------------------------------------------------------
# Remember and reload the last selected desktop session and username
save = true
load = true
save_file = /etc/ly/save

# Focus password field on startup when username is saved (1=login, 2=password)
default_input = 2

# Directory containing Wayland session desktop entries
waylandsessions = /usr/share/wayland-sessions
wayland_specifier = false

# ------------------------------------------------------------------------------
# System & Power Commands (Void Linux / runit)
# ------------------------------------------------------------------------------
shutdown_cmd = /sbin/shutdown -h now
restart_cmd = /sbin/shutdown -r now

# Virtual terminal number (Ly runs on TTY2 by default)
tty = 2
