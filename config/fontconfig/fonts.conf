<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>~/.local/share/fonts/wm</dir>

  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Maple Mono</string>
      <string>SymbolsNF</string>
    </edit>
  </match>

  <alias>
    <family>Maple Mono</family>
    <prefer>
      <family>Maple Mono</family>
      <family>SymbolsNF</family>
    </prefer>
  </alias>
</fontconfig>
