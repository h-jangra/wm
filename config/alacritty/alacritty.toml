[general]
import = ["colors.toml"]
live_config_reload = true
ipc_socket = true

[terminal]
# shell = { program = "tmux" }

[env]
TERM = "alacritty"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
position = "None"
dynamic_padding = true
decorations = "None"
opacity = 0.9
blur = true
startup_mode = "Windowed"
dynamic_title = true
class = { instance = "Alacritty", general = "Alacritty" }
decorations_theme_variant = "None"

[window.dimensions]
columns = 95
lines = 24

[window.padding]
x = 20
y = 20

[scrolling]
history = 10000
multiplier = 3

[bell]
animation = "Linear"
duration = 20
command = { program = "paplay", args = ["/usr/share/sounds/freedesktop/stereo/dialog-error.oga"] }

[keyboard]
bindings = [
  { key = "Back", mods = "Control", chars = "\u001b[127;5u" },
  { key = "Return", mods = "Control|Shift", chars = "\u001b[13;5u" },
  { key = "Return", mods = "Control|Alt", chars = "\u001b[13;6u" },
  { key = "Tab", mods = "Control", chars = "\u001b[9;5u" },
  { key = "Tab", mods = "Control|Shift", chars = "\u001b[9;6u" },
]

[selection]
save_to_clipboard = true

[cursor]
vi_mode_style = "None"
blink_interval = 750
blink_timeout = 5
unfocused_hollow = false
thickness = 0.15

[cursor.style]
shape = "Block"

[mouse]
hide_when_typing = false

[[hints.enabled]]
command         = "xdg-open"
hyperlinks      = true
post_processing = true
persist         = false
mouse.enabled   = true
binding         = { key = "U", mods = "Control|Shift" }
regex           = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩‘]+"

[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
renderer = "None"
print_events = false
highlight_damage = false
prefer_egl = false

[font]
size = 14
builtin_box_drawing = true

[font.normal]
family = "Maple Mono NF"

[font.bold]
family = "Maple Mono NF"

[font.italic]
family = "Maple Mono NF"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0
