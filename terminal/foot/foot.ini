# ==============================================================================
# Foot Terminal Configuration (Nord Palette)
# Lightweight, blazing-fast Wayland native terminal emulator.
# ==============================================================================

# Font & Metrics
font=JetBrains Mono:size=10
font-bold=JetBrains Mono:size=10:weight=bold
font-italic=JetBrains Mono:size=10:slant=italic
line-height=18
letter-spacing=0
horizontal-letter-offset=0
vertical-letter-offset=0

# Padding & Layout
pad=12x12
initial-window-size-chars=100x28
initial-window-mode=windowed
title=foot
app-id=foot

# Cursor & Bell
[cursor]
style=beam
color=2e3440 d8dee9
blink=yes

[bell]
urgent=yes
notify=no

[scrollback]
lines=5000
multiplier=3.0

# Nord Colorway
[colors]
alpha=0.96
background=2e3440
foreground=d8dee9

## Normal/Regular Colors (Nord Polar Night & Aurora)
regular0=3b4252  # black (Nord 1)
regular1=bf616a  # red (Nord 11)
regular2=a3be8c  # green (Nord 14)
regular3=ebcb8b  # yellow (Nord 13)
regular4=81a1c1  # blue (Nord 9)
regular5=b48ead  # magenta (Nord 15)
regular6=88c0d0  # cyan (Nord 8)
regular7=e5e9f0  # white (Nord 5)

## Bright Colors (Nord Snow Storm & Frost)
bright0=4c566a   # bright black (Nord 3)
bright1=bf616a   # bright red
bright2=a3be8c   # bright green
bright3=ebcb8b   # bright yellow
bright4=81a1c1   # bright blue
bright5=b48ead   # bright magenta
bright6=8fbcbb   # bright cyan (Nord 7)
bright7=eceff4   # bright white (Nord 6)

## Selection Colors
selection-foreground=2e3440
selection-background=88c0d0
